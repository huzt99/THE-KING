name: unirouter
description: "All-in-One Router Management App for Hussein Net"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Network & Hardware Libraries
  network_info_plus: ^5.0.1      # للحصول على IP الهاتف والـ Gateway
  http: ^1.2.0                   # لإرسال طلبات HTTP/REST للراوترات
  ping_discover_network_plus: ^2.1.0 # لفحص الأجهزة المتصلة بالشبكة
  dart_ping: ^8.0.1              # أداة تشخيص Ping
  shared_preferences: ^2.2.2     # لحفظ بيانات الراوتر المحفوظة
  crypto: ^3.0.3                 # للتشفير (MD5/SHA256) المطلوبة لراوترات TP-Link/Tenda
  font_awesome_flutter: ^10.7.0  # أيقونات عصرية
  url_launcher: ^6.2.5           # لفتح روابط الراوتر، النانو، والأونيو في متصفح الهاتف

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # أداة توليد الأيقونات

# إعدادات الأيقونة الخاصة بـ (Hussein Net / Plague Doctor)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png" # مسار الصورة التي أرسلتها
  android: true
  ios: true
  min_sdk_android: 21 # أدنى نسخة أندرويد مدعومة (تضمن التوافق)
  # adaptive_icon_background: "#FBB13D" # اختياري: لون الخلفية الأصفر في أندرويد 8+ إذا كانت الخلفية مفرغة
  # adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  
  # تعريف مجلد الـ Assets للصور والأيقونات
  assets:
    - assets/
    - assets/icon/
