name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean Project
        run: flutter clean

      - name: Force Fix Android Embedding
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/unirouter_manager
          cat << 'EOF' > android/app/src/main/kotlin/com/example/unirouter_manager/MainActivity.kt
          package com.example.unirouter_manager

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniRouter-HusseinNet-APK
          path: build/app/outputs/flutter-apk/app-release.apk
